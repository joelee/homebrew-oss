name: Test Formula

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-formula:
    strategy:
      fail-fast: false
      matrix:
        formula:
          - cli-bot
          - gmail-tool
          - passalong
    runs-on: macos-latest
    env:
      # Homebrew 7 loads formulae only from trusted taps, and a tap cloned
      # from a local folder cannot be trusted by name. Homebrew calls this
      # variable deprecated but still honours it.
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

    steps:
      - name: Check out tap repository
        uses: actions/checkout@v4

      - name: Set up Homebrew tap
        run: |
          brew tap joelee/oss "$GITHUB_WORKSPACE"

      - name: Install formula from source
        run: |
          brew install --build-from-source "joelee/oss/${{ matrix.formula }}"

      - name: Run formula test
        run: |
          brew test "joelee/oss/${{ matrix.formula }}"

      - name: Audit formula
        run: |
          brew audit --strict "joelee/oss/${{ matrix.formula }}"
